name: Fetch Taskmarket data (hourly)

on:
  schedule:
    - cron: "7 * * * *"  # hourly — re-registered 25 Nov 2026 (r40: 0 scheduled runs since creation, re-push per standing order)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Fetch data from api.taskmarket.dev
        run: python3 scripts/fetch.py
      - name: Commit fresh data
        run: |
          git config user.name "taskmarket-visualizer-bot"
          git config user.email "taskmarket-visualizer-bot@users.noreply.github.com"
          git add data/data.json og.png
          git diff --cached --quiet || git commit -m "data: hourly refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
